{{define "head"}}
<!doctype html>
<html lang="{{.T.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#212529">
<title>AirMX</title>
<link rel="icon" type="image/svg+xml" href="{{asset "/static/favicon.svg"}}">
<script>
// Apply the system color scheme before first paint to avoid a flash;
// Bootstrap 5.3 components react to html[data-bs-theme].
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var apply = function () { document.documentElement.dataset.bsTheme = mq.matches ? "dark" : "light"; };
  apply();
  mq.addEventListener("change", apply);
})();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
<link rel="stylesheet" href="{{asset "/static/style.css"}}">
</head>
<body>
<nav class="navbar navbar-expand navbar-blur sticky-top">
  <div class="container container-narrow">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
      <span class="brand-badge"><i class="bi bi-envelope-at"></i></span>AirMX
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="/lang?set={{if eq .T.Lang "zh"}}en{{else}}zh{{end}}"><i class="bi bi-translate me-1"></i>{{.T.LangSwitch}}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>{{.T.Logout}}</a>
      </li>
    </ul>
  </div>
</nav>
<main class="container container-narrow py-4">
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
