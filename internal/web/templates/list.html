{{template "head" .}}
{{if .Messages}}
<table>
  <tr><th>主题</th><th>发件人</th><th>日期</th></tr>
  {{range .Messages}}
  <tr {{if .Unread}}class="unread"{{end}}>
    <td><a href="/mail/{{$.Folder}}/{{.ID}}">{{if .Subject}}{{.Subject}}{{else}}(无主题){{end}}</a></td>
    <td>{{.From}}</td>
    <td class="date">{{.Date.Format "2006-01-02 15:04"}}</td>
  </tr>
  {{end}}
</table>
{{else}}
<div class="empty">没有邮件</div>
{{end}}
{{template "foot" .}}
