<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - airmx</title>
<style>
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0;
         background: #f0f2f5; display: flex; align-items: center; justify-content: center;
         min-height: 100vh; }
  .card { background: #fff; padding: 32px 36px; border-radius: 10px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 320px; }
  h1 { font-size: 22px; margin: 0 0 24px; color: #2c3e50; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; margin-bottom: 16px;
          border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: #2c6fbb; }
  button { width: 100%; padding: 10px; background: #2c6fbb; color: #fff; border: none;
           border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #245a99; }
  .error { background: #fdecea; color: #b3261e; padding: 8px 10px; border-radius: 6px;
           font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>airmx 邮箱</h1>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
