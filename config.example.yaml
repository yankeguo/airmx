# airmx example configuration

# Hostname of this server, used in SMTP greetings and the
# Authentication-Results header.
domain: mail.example.com

# SMTP listen address. Port 25 for real inbound mail
# (requires root or CAP_NET_BIND_SERVICE).
smtp_listen: ":25"

# Web UI listen address.
web_listen: ":8080"

# Mail storage root (maildir layout:
# <data_dir>/<recipient>/<inbox|spam>/{tmp,new,cur}).
# Keep this as /var/lib/airmx/data when using the bundled airmx.service;
# use ./data for local development.
data_dir: "/var/lib/airmx/data"

# Recipient allowlist. RCPT TO addresses not listed here are rejected
# at SMTP time with 550. "*@example.com" wildcards a whole domain.
recipients:
  - "me@example.com"
  - "*@lists.example.com"

# Web UI credentials (login page with encrypted cookie session).
web:
  username: admin
  # bcrypt hash; generate with `airmx hashpw <password>`
  password_bcrypt: "$2a$10$replace-me-with-output-of-hashpw"

# Anti-spam policy. Each action is one of:
#   reject - refuse the message with 554 after DATA
#   spam   - deliver to the spam folder
#   inbox  - deliver to the inbox
policy:
  # DMARC check failed: the From domain publishes a DMARC record and
  # neither SPF nor DKIM passed with an aligned domain.
  dmarc_fail: reject
  # SPF hard fail: the sender domain explicitly denies the client IP (-all).
  spf_fail: reject
  # SPF soft fail: the sender domain marks the client IP as suspicious (~all).
  spf_softfail: spam
  # DKIM signature present but invalid.
  dkim_fail: inbox
  # Everything else: all checks passed, or no records published.
  default: inbox
