# Push of a v-prefixed semver tag, including pre-release suffixes.
#
#   v1.2.3
#   v1.2.3-rc.1
#   v1.2.3-rc1
#   v1.2.3-alpha
#   v1.2.3-alpha.1
#   v1.2.3-beta.2
#
# Order
# -----
#   version -> test -> (docker-publish and binaries in parallel) -> GitHub Release
#
# version runs first and does not check out the repo, so a tag the glob
# accepts but semver rejects (v01.2.3, v1.2.3-, v1.2.3-rc.01) fails in
# seconds, before tests, the multi-arch image, or six cross-compiles.
#
# test.yml is called after version and before any publish. Tag pushes do
# not start test.yml on their own; see that file.
#
# docker and binaries both need test, so they run together. The release job
# needs both. The GitHub Release is created only after the image push has
# succeeded, so the release page does not advertise an image tag that failed
# to push. action-gh-release updates the existing release for this tag on a
# re-run, which is how a failed asset upload is repaired without deleting
# the tag.
#
# binaries needs version directly, not only via test. Job outputs are
# visible to jobs that `needs` the producer. They are not inherited
# transitively through test, so `needs: [version, test]` is required even
# though test already needs version. The release job needs version for the
# same reason (prerelease flag and the version string in the body).
#
# Matrix fail-fast stays at the default (true). One target that does not
# compile should stop the other five rather than upload a partial set.
#
# Tag filter (GitHub glob, not a regex)
# -------------------------------------
#   v[0-9]+.[0-9]+.[0-9]+       v1.2.3
#   v[0-9]+.[0-9]+.[0-9]+-*     v1.2.3-rc.1 and any other hyphen suffix
#
# In a workflow filter, `+` means "one or more of the preceding character or
# class", `[]` is a character class, and `*` matches any string except `/`.
# The pattern is matched against the whole tag. The first pattern therefore
# does not match v1.2.3-rc.1; the extra suffix needs the second pattern.
# Quotes are required because `[` is special in YAML.
#
# The glob is wider than semver on purpose (it is only a cheap event
# filter). It accepts v01.2.3 and v1.2.3-. The version job below is the
# real check. A bare 1.2.3 with no "v" does not match, and neither does
# build metadata (v1.2.3+build). `+` is awkward in git refs and illegal in
# a Docker tag; rc-style suffixes use `-`, which is the requested form.
#
# Version job
# -----------
# bash and grep -Eq, with no checkout and no Go, so invalid tags stay
# cheap. ${TAG#v} is bash prefix removal of a literal "v", not a regex. If
# the tag had no leading v, TAG and ver compare equal and the job fails.
# That still rejects 1.2.3 if the glob is widened later.
#
# The expression is semver's grammar for MAJOR.MINOR.PATCH and an optional
# pre-release:
#   - a numeric identifier is 0 or a number without a leading zero
#     (0 is legal, 01 is not)
#   - any other identifier must contain a letter or a hyphen, so rc, rc1,
#     alpha, beta.2, and 0rc pass, while 01 and rc.01 fail
# metadata-action parses tags with the semver package, which rejects those
# same leading-zero forms. Catching them here avoids an empty Docker tag
# list and a later, less obvious failure in docker-publish.yml.
# `if ! grep` is required under `set -euo pipefail`: a non-matching grep
# exits 1, and without the if the script would die before the error line.
#
# prerelease is true when the version contains `-`. A stable core
# (1.2.3) has none. That flag drives both the GitHub pre-release checkbox
# and make_latest. It is a string "true"/"false" because job outputs are
# strings.
#
# Binaries
# --------
# Six targets, built on ubuntu-latest:
#   linux, darwin, windows  x  amd64, arm64
# That is the mainstream desktop/server set. linux/arm v7, 386, riscv64,
# and freebsd are not in the matrix. No macOS or Windows runners: the
# module does not use cgo, so CGO_ENABLED=0 cross-compiles from Linux. The
# Dockerfile uses the same CGO flag. A Windows arm64 binary does not need a
# Windows runner when cgo is off.
#
# -trimpath and -ldflags "-s -w" match the image build (smaller binary,
# paths independent of the runner checkout). -X main.assetVersion stamps
# the release version without "v" (1.2.3-rc.1), not the git SHA, so asset
# URLs for a release stay on that version. See docker-publish.yml for why
# the image on main still stamps the full SHA.
#
# Archive names follow the usual Go release shape
# airmx_<version>_<os>_<arch>.tar.gz, with .zip on Windows because a zip
# is what Windows users unpack without extra tools. The archive contains
# only the binary at its root (tar -C, and zip from inside the stage dir).
# The binary is airmx, or airmx.exe on Windows. zip -X strips extra zip
# attributes so the archive is the file itself. The stage directory is
# mktemp so the workspace is not left holding a binary named airmx (that
# path is also gitignored).
#
# goreleaser was not introduced. The packaging is a short shell script, and
# keeping it in this file means another project can copy the workflow
# without a second config language. The archive names and the single
# SHA256SUMS file are the layout people already expect from goreleaser.
#
# Each matrix leg uploads its own artifact. upload-artifact v4 and later
# cannot append files to one artifact name from parallel jobs; a shared
# name fails the second upload. download-artifact then merges airmx-* into
# one directory (merge-multiple). Pattern airmx-* is the artifact name, not
# the filename inside it.
# retention-days: 1 because the artifact only has to cross the job boundary.
# The GitHub Release asset is the durable copy.
# if-no-files-found: error, and fail_on_unmatched_files on the release
# action, so a missing archive fails the job instead of publishing a
# partial release.
# upload-artifact is v7 and download-artifact is v8. Those two actions do
# not share a major version. Both are the Node 24 line (see test.yml).
#
# SHA256SUMS is generated once, after the merge, in dist/, so every line is
# a basename (sha256sum's two-space format) and the checksum file does not
# include itself. Per-archive .sha256 sidecars were not added; one SUMS
# file is the thing people verify.
#
# GitHub Release
# --------------
# softprops/action-gh-release@v3. v2 is the last Node 20 release and is
# unmaintained; hosted runners no longer provide Node 20.
# The release name is the git tag (v1.2.3-rc.1), not the stripped version,
# so the title matches the ref that was pushed.
# generate_release_notes is on. When body is also set, GitHub prepends body
# to the generated notes. The body states the image tag and the floating-tag
# rules so the release page matches docker-publish.yml.
# prerelease is a boolean input, so the expression is a comparison
# (`== 'true'`).
# make_latest is a string enum (true / false / legacy), not a boolean, and
# GitHub expressions have no ternary. `cond && 'false' || 'true'` works
# because any non-empty string is truthy, including the string false:
#   pre-release: true && 'false' yields 'false', and 'false' || 'true'
#                keeps 'false' (the string is truthy, so || does not run)
#   stable:      false && 'false' yields false, and false || 'true'
#                yields 'true'
# A pre-release cannot be the repository's latest release on the GitHub
# API; setting make_latest explicitly keeps the action from sending true.
# draft is left unset. action-gh-release v3 notes that a repository with
# immutable releases should upload a pre-release as a draft and publish
# afterwards. This repo does not use immutable releases, so the release is
# published as soon as the assets are attached and release.prereleased
# still fires.
#
# Checkout depth stays at the default (1). Release notes come from the
# GitHub API, not from local git history, and metadata-action reads the tag
# from GITHUB_REF.
#
# Permissions and concurrency: same rules as docker.yml. The workflow-level
# block is the ceiling (contents: write is what creating a release needs;
# packages/id-token/attestations are what docker-publish.yml needs). Each
# job narrows. cancel-in-progress is false so this file's own group does
# not cancel a tag build. test.yml's group can still cancel a re-push of
# the same tag; that caveat is documented there.
# No workflow_dispatch: dispatching a release from an arbitrary ref would
# publish whatever tag filter happened to match.

name: release

on:
  push:
    tags:
      # Whole-tag globs. The second pattern is what admits -rc / -beta /
      # -alpha and any other hyphenated semver pre-release. See header.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      # No checkout. Invalid tags should die before any clone.
      # TAG is an env var so the ref is not interpolated into the script.
      - name: Validate semver tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # Numeric identifiers: 0 or [1-9][0-9]*. Other pre-release
          # identifiers must contain a letter or hyphen (rc, rc.1, alpha).
          # Rejects v01.2.3, v1.2.3-01, v1.2.3-rc.01, v1.2.3+build.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [ "${TAG}" = "${ver}" ] || ! printf '%s\n' "${ver}" | grep -Eq "${semver}"; then
            echo "::error::${TAG} is not a supported semver tag (example: v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          pre=false
          case "${ver}" in
            *-*) pre=true ;;
          esac
          printf 'version=%s\n' "${ver}" >> "${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${pre}" >> "${GITHUB_OUTPUT}"

  test:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Parallel with binaries. Release waits for this job so a failed image
  # push does not create the GitHub Release.
  docker:
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml

  # needs version directly: outputs do not pass through `test`.
  binaries:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="airmx_${VERSION}_${GOOS}_${GOARCH}"
          stage="$(mktemp -d)"
          if [ "${GOOS}" = "windows" ]; then
            bin="airmx.exe"
            archive="${name}.zip"
          else
            bin="airmx"
            archive="${name}.tar.gz"
          fi
          go build -trimpath -ldflags="-s -w -X main.assetVersion=${VERSION}" -o "${stage}/${bin}" .
          if [ "${GOOS}" = "windows" ]; then
            (cd "${stage}" && zip -q -X "${GITHUB_WORKSPACE}/${archive}" "${bin}")
          else
            tar -C "${stage}" -czf "${archive}" "${bin}"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: airmx-${{ matrix.os }}-${{ matrix.arch }}
          path: airmx_${{ needs.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, docker, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: airmx-*
          merge-multiple: true
          path: dist

      # One SUMS file for every archive. working-directory keeps the names
      # in the checksum list as basenames, and the file is written after
      # sha256sum's input glob is expanded so it does not checksum itself.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum airmx_* | tee SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # String enum, not a boolean. See the header for why this
          # expression yields the string false for a pre-release.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Docker image: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`

            Stable tags also publish `major.minor` and `major` image tags. Floating tags that are only a leading zero (`0`, `0.0`) are omitted. Pre-release tags (for example `-rc.1`, `-beta.2`, `-alpha`) publish the full version only and are marked as GitHub pre-releases.
          files: |
            dist/airmx_*
            dist/SHA256SUMS
