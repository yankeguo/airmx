# Publish ghcr.io/<repo> for the calling workflow's git ref.
#
#   push to the default branch (main):  :latest
#   tag v1.2.3:                          :1.2.3 :1.2 :1
#   tag v1.2.3-rc.1 (any pre-release):   :1.2.3-rc.1
#   tag v0.2.0:                          :0.2.0 :0.2          (not :0)
#   tag v0.0.1:                          :0.0.1               (not :0 or :0.0)
#
# The leading "v" is removed. Commit SHAs are not used as tags.
# flavor latest=false: semver events would otherwise also move :latest.

name: docker-publish

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image revision
        id: rev
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'value=%s\n' "${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            printf 'value=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Require image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS}" ]; then
            echo "::error::no Docker tags generated for ${GITHUB_REF}"
            exit 1
          fi
          printf '%s\n' "${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: REVISION=${{ steps.rev.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=airmx
          cache-to: type=gha,mode=max,scope=airmx
